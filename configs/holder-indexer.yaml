# holder-indexer keeps ERC-20 and native coin balances per holder of every
# chain in PostgreSQL, where market-api and market-rankings read them.
# Durations may be written as Go durations such as 500ms or 5m; any ${NAME}
# or ${NAME:default} is read from the environment.

# Where chain topics are read from: kafka or file.
# kafka: each chain's topic on the kafka brokers below.
# file: <file.dir>/<topic>.jsonl, one stream.v1.StreamRecord in protobuf JSON
#   per line, as chainstream-evm writes with output.type file and
#   output.file.format protojson. The file is followed as it grows; a
#   record's offset is its index among the non-blank lines.
source:
  driver: kafka
  file:
    dir: data
    poll_interval: 200ms

kafka:
  brokers:
    - 127.0.0.1:9092
  client_id: holder-indexer
  # Must be >= chainstream-evm's max_message_bytes.
  fetch_max_bytes: 104857600
  fetch_max_wait: 500ms

# The database of the holder tables. Every service creates all of the
# shared tables, so they can start in any order.
postgres:
  dsn: postgres://market:market@127.0.0.1:5432/market
  schema: public

holders:
  # How many recent blocks stay revertible in addition to everything above
  # the finalized height.
  history_depth: 256
  # Every this many blocks, the least recently verified holdings are checked
  # against balanceOf to catch rebasing and fee-on-transfer drift. -1 disables.
  reconcile_every: 100
  reconcile_batch: 200
  rpc_batch_size: 100
  rpc_timeout: 30s
  # Also keep native coin (ETH, BNB) balances under the token
  # 0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee. Every address a block's
  # native_touched lists (senders, recipients, fee recipient) is read with
  # Multicall3's getEthBalance at that block, batched with balanceOf: roughly
  # one or two reads per transaction. Chains without a known multicall
  # contract, such as a local dev chain, skip it with a warning.
  native_balances: true

# Prometheus metrics at /metrics on addr; empty turns them off.
metrics:
  addr: ""

# One chainstream-evm topic per chain, each consumed in order. rpc_url must
# answer eth_call by block hash (EIP-1898) near the head: a holding is seeded
# with balanceOf at the block it first appears in.
chains:
  - {name: eth, chain_id: 1, topic: chainstream-eth, rpc_url: http://127.0.0.1:8545}
  - {name: bsc, chain_id: 56, topic: chainstream-bsc, rpc_url: http://127.0.0.1:8545}
  - {name: base, chain_id: 8453, topic: chainstream-base, rpc_url: http://127.0.0.1:8545}
