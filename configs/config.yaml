kafka:
  brokers:
    - 127.0.0.1:9092
  client_id: market-engine
  # Must be >= chainstream-evm's max_message_bytes.
  fetch_max_bytes: 104857600
  fetch_max_wait: 500ms

storage:
  # Where trades, prices and candles go: memory or clickhouse.
  driver: memory
  clickhouse:
    addr:
      - 127.0.0.1:9000
    database: market
    username: default
    password: ""
    dial_timeout: 5s
    # Ages rows out by block time, in whole days; 0 keeps them. market-engine
    # applies this to its tables at startup and ch-loader to the raw ones.
    # Fact tables are partitioned by month; trades and raw tables drop a
    # month whole once its newest row expires, so rows can stay up to a
    # month longer than their age. Changing a value rewrites the affected
    # tables' parts in the background.
    retention:
      # Cold tier: parts older than cold_after_days move to cold_volume of
      # storage_policy, a policy defined in the ClickHouse server config with
      # a "default" volume for hot parts (tables created without a policy
      # live there) and the cold volume. Set both or neither; a table cannot
      # go back to its old policy.
      storage_policy: ""
      cold_volume: cold
      cold_after_days: 0
      # market-engine output. Older token_prices rows are rolled up to the
      # latest per token and month, so every token keeps its last price;
      # older candle buckets keep only their final version, which needs
      # more than the deepest reorg. Candles of intervals left out of
      # candle_days are kept; rankings.candle_interval needs 2 days or more.
      trades_days: 180
      token_price_rollup_days: 30
      candle_compact_days: 3
      candle_days: {1m: 30, 5m: 180}
      # ch-loader raw facts. Asset and pool facts are always kept.
      raw_transfers_days: 90
      raw_trades_days: 90
      oracle_updates_days: 0

# Where checkpoints and market state are kept: memory or postgres.
# memory: a restart replays each topic from offset zero, and the output store
#   overwrites the heights it already holds.
# postgres: each record's state changes are committed with its checkpoint, so
#   a restart resumes at the next record.
state:
  driver: memory
  postgres:
    dsn: postgres://market:market@127.0.0.1:5432/market
    schema: public

market:
  # A pool prices a token only when its priced counterpart reserve is worth this much.
  min_liquidity_usd: 1000
  # A pool's trades join a token's aggregated candles only above this quote reserve value.
  candle_min_liquidity_usd: 10000
  max_hops: 3
  intervals: [1m, 5m, 15m, 1h, 4h, 24h]
  # Blocks kept revertible beyond the finalized height.
  history_depth: 256
  # A feed-backed token falls back to its oracle answer when the graph price
  # deviates by more than this fraction.
  oracle_deviation: 0.02
  # A swap whose USD price strays from its base token's reference price (set
  # by an anchor, an oracle answer or the token's most liquid pool) by more
  # than this ratio is marked outlier and left out of the token's candles;
  # 0.5 keeps swaps between 1/1.5x and 1.5x of the reference. -1 disables.
  outlier_deviation: 0.5
  # A trade whose token decimals are unknown is held this many blocks and
  # replayed, with its candles, once the decimals arrive; -1 drops it.
  late_trade_blocks: 7200
  # At most this many trades are held while waiting on one token.
  late_trades_per_token: 1000
  # With storage.driver: clickhouse, the block that brings a token's decimals
  # also recomputes the token's trades from up to this many blocks back, from
  # the raw trades ch-loader stored, with its prices and candles; -1 replays
  # only held trades.
  backfill_blocks: 50400
  # How long a backfill waits for ch-loader to reach the heights it reads
  # before it falls back to the held trades.
  backfill_wait: 30s

# holder-indexer keeps ERC-20 balances per holder in the state.postgres
# database; it needs state.driver: postgres and an rpc_url on every chain.
holders:
  history_depth: 256
  # Every this many blocks, the least recently verified holdings are checked
  # against balanceOf to catch rebasing and fee-on-transfer drift. -1 disables.
  reconcile_every: 100
  reconcile_batch: 200
  rpc_batch_size: 100
  rpc_timeout: 30s

# ch-loader copies raw facts (every ERC-20 transfer, unoriented trades, oracle
# updates, asset and pool facts) into the storage.clickhouse database; it
# needs storage.driver: clickhouse. Blocks older than batch_lag are written in
# batches of up to flush_rows facts or flush_interval; newer blocks one by one.
ch_loader:
  batch_lag: 5m
  flush_rows: 100000
  flush_interval: 2s

# market-registry keeps token and pool metadata in the state.postgres
# database; it needs state.driver: postgres.
registry:
  history_depth: 256

# market-rankings rolls market-engine's ClickHouse output, holder counts and
# registry metadata into the token_rankings table that market-api lists; it
# needs storage.driver: clickhouse and state.driver: postgres.
rankings:
  refresh_interval: 1m
  # Token candle size summed for the 24h columns; one of market.intervals.
  candle_interval: 5m
  # Latest prices from this far behind the last refresh's chain head are
  # read again, so a reorg that moved them is picked up.
  reorg_window: 1h

# market-api serves what market-engine stored and transfers from ch-loader's
# tables; it needs storage.driver: clickhouse. With state.driver: postgres it
# also serves holders from holder-indexer, token and pool metadata from
# market-registry and token lists from market-rankings.
api:
  addr: ":8080"

# Realtime push. market-engine publishes each block's trades and candles, and
# reorg corrections, to every chain's live_topic (default "<topic>-live");
# market-api streams them to WebSocket clients at /v1/stream.
live:
  enabled: false
  # Blocks further than this behind the clock are not pushed, so a catch-up
  # does not flood clients; a negative value pushes every block.
  max_lag: 10m
  # How often each changed candle bucket is sent, at its latest value.
  # Trades are sent at once.
  candle_throttle: 250ms
  # A client this many messages behind is disconnected as too slow.
  client_buffer: 1024
  max_subscriptions: 200
  # Other origins browsers may connect from, e.g. [localhost:5173].
  allowed_origins: []

# One chainstream-evm topic per chain, each consumed in order by its own engine.
#
# feeds are the Chainlink USD feeds trusted on each chain. Each names the
# feed's proxy; at startup market-engine reads it over the chain's rpc_url
# (so rpc_url must answer eth_call) for its decimals and the aggregator of
# every phase, which are the contracts that emit AnswerUpdated, and fails if
# description does not match. Restart after Chainlink moves a feed to a new
# aggregator. Without an rpc_url, list an aggregator as {address, token,
# decimals} instead and keep it current by hand. A feed may price several
# tokens, one entry each, such as USDC and bridged USDbC on Base.
# The proxies were taken from the Venus, Compound and Moonwell deployment
# configs where they list them; the description check catches a wrong one.
chains:
