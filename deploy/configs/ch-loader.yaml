# ch-loader for the docker-compose stack; configs/ch-loader.yaml documents
# each setting.
kafka:
  brokers: [kafka:9092]
  client_id: ch-loader

clickhouse:
  addr: [clickhouse:9000]
  database: market
  username: default
  password: ""

metrics:
  addr: ":9100"

chains:
  - {name: eth, chain_id: 1, topic: chainstream-eth}
