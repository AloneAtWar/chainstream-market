# chainstream-market config for the docker-compose stack. Every service
# without a file of its own in this directory reads this file;
# configs/config.yaml documents each setting. ${NAME} and ${NAME:default}
# come from the environment (deploy/.env).
kafka:
  brokers: [kafka:9092]
  client_id: chainstream-market

storage:
  driver: clickhouse
  clickhouse:
    addr: [clickhouse:9000]
    database: market
    username: default
    password: ""

state:
  driver: postgres
  postgres:
    dsn: postgres://market:market@postgres:5432/market

api:
  addr: ":8080"

live:
  enabled: true
  allowed_origins: ["localhost:*", "127.0.0.1:*"]

metrics:
  addr: ":9100"

# One chain: eth mainnet, scanned by the chainstream-evm service. Its node
# also serves holder-indexer's balanceOf reads and the feed proxies.
chains:
  - name: eth
    chain_id: 1
    topic: chainstream-eth
    rpc_url: ${ETH_RPC_URL:http://host.docker.internal:8545}
    feeds:
      - {proxy: "0x3E7d1eAB13ad0104d2750B8863b489D65364e32D", token: "0xdac17f958d2ee523a2206206994597c13d831ec7", description: "USDT / USD"}  # USDT
