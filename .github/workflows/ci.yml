name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLICKHOUSE_ADDR: 127.0.0.1:9000
      POSTGRES_DSN: postgres://market:market@127.0.0.1:5432/market
      GOPRIVATE: github.com/AloneAtWar
      GONOSUMDB: github.com/AloneAtWar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure OMB deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.OMB_SSH_PRIVATE_KEY }}

      - name: Use SSH for private GitHub modules
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.59.0"
          github_token: ${{ github.token }}

      - name: Install golangci-lint
        run: make lint-install

      - name: Verify generated code
        run: |
          make generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: Verify
        run: make verify
