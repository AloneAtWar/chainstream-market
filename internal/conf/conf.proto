syntax = "proto3";

package conf;

option go_package = "github.com/AloneAtWar/chainstream-market/internal/conf;conf";

import "google/protobuf/duration.proto";

// Bootstrap is the configuration every command reads. Each command uses the
// sections it needs; configs/config.yaml documents every setting. Durations
// may be written as Go durations such as 500ms or 5m.
message Bootstrap {
  Kafka kafka = 1;
  Storage storage = 2;
  State state = 3;
  Market market = 4;
  API api = 5;
  Holders holders = 6;
  Registry registry = 7;
  Rankings rankings = 8;
  // ch_loader is named after the ch-loader command.
  ChLoader ch_loader = 9;
  Live live = 10;
  Metrics metrics = 11;
  repeated Chain chains = 12;
  Source source = 13;
}

// Source selects where the commands read chain topics from.
message Source {
  // driver is kafka or file. kafka reads each chain's topic from the kafka
  // brokers; file reads it from a file, see FileSource.
  string driver = 1;
  FileSource file = 2;
}

// FileSource reads each chain's records from <dir>/<topic>.jsonl, one
// stream.v1.StreamRecord in protobuf JSON per line, such as chainstream-evm
// writes with output.type file and output.file.format protojson. A record's
// offset is its index among the file's non-blank lines. The file is
// followed as it grows.
message FileSource {
  string dir = 1;
  // poll_interval is how often the end of a file is checked for new lines.
  google.protobuf.Duration poll_interval = 2;
}

// Kafka configures the kafka clients: chain topic consumers with
// source.driver kafka, and live push with live.driver kafka.
message Kafka {
  repeated string brokers = 1;
  string client_id = 2;
  // fetch_max_bytes must be at least chainstream-evm's max_message_bytes, or
  // a large block can never be fetched.
  int32 fetch_max_bytes = 3;
  google.protobuf.Duration fetch_max_wait = 4;
}

// Storage selects where market output goes.
message Storage {
  // driver is memory or clickhouse.
  string driver = 1;
  ClickHouse clickhouse = 2;
}

message ClickHouse {
  repeated string addr = 1;
  string database = 2;
  string username = 3;
  string password = 4;
  google.protobuf.Duration dial_timeout = 5;
  Retention retention = 6;
}

// Retention ages rows out of ClickHouse by block time, in whole days; zero
// keeps them. market-engine applies it to trades, token_prices and candles
// at startup, and ch-loader to its raw tables. Its fields match
// chstore.Retention, which documents them.
message Retention {
  // storage_policy names a ClickHouse storage policy with a "default" volume
  // for hot parts and cold_volume.
  string storage_policy = 1;
  string cold_volume = 2;
  int32 cold_after_days = 3;
  int32 trades_days = 4;
  int32 token_price_rollup_days = 5;
  int32 candle_compact_days = 6;
  // candle_days is keyed by candle interval, such as 1m.
  map<string, int32> candle_days = 7;
  int32 raw_transfers_days = 8;
  int32 raw_trades_days = 9;
  int32 oracle_updates_days = 10;
}

// State selects where checkpoints and processor state are kept. In memory, a
// restart replays each topic from offset zero and the output store
// overwrites the heights it already holds. In PostgreSQL, every record's
// state changes are committed with its checkpoint and a restart resumes at
// the next record.
message State {
  // driver is memory or postgres.
  string driver = 1;
  Postgres postgres = 2;
}

message Postgres {
  string dsn = 1;
  // schema holds the tables; empty uses public.
  string schema = 2;
}

// Market tunes pricing and candle aggregation for every chain.
message Market {
  // min_liquidity_usd is the counterpart reserve value a pool needs before a
  // price propagates through it.
  double min_liquidity_usd = 1;
  // candle_min_liquidity_usd is the quote reserve value a pool needs before
  // its trades join a token's aggregated candles.
  double candle_min_liquidity_usd = 2;
  uint32 max_hops = 3;
  repeated google.protobuf.Duration intervals = 4;
  // history_depth is how many recent blocks stay revertible in addition to
  // everything above the finalized height.
  int64 history_depth = 5;
  // oracle_deviation is the largest relative gap between a feed-backed
  // token's graph price and its oracle answer before the answer wins.
  double oracle_deviation = 6;
  // outlier_deviation is how far, as a ratio, a swap's USD price may stray
  // from its base token's reference price, set by another pool, before the
  // swap is left out of the token's candles; -1 turns filtering off.
  double outlier_deviation = 7;
  // late_trade_blocks is how many blocks a trade whose token decimals are
  // unknown waits for them before it is dropped; -1 drops it at once.
  int64 late_trade_blocks = 8;
  // late_trades_per_token caps the trades held while waiting on one token.
  int32 late_trades_per_token = 9;
  // backfill_blocks is how far back the block that brings a token's
  // decimals recomputes the token's trades, prices and candles from
  // ch-loader's raw trades; -1 replays only held trades. It needs
  // storage.driver: clickhouse.
  int64 backfill_blocks = 10;
  // backfill_wait is how long a backfill waits for ch-loader to store the
  // heights it reads before it replays only held trades.
  google.protobuf.Duration backfill_wait = 11;
}

// API configures market-api, which reads the ClickHouse store.
message API {
  string addr = 1;
}

// Holders tunes holder-indexer, which keeps ERC-20 balances per holder in the
// state.postgres database.
message Holders {
  // history_depth is how many recent blocks stay revertible in addition to
  // everything above the finalized height.
  int64 history_depth = 1;
  // reconcile_every is how often, in blocks, the least recently verified
  // holdings are checked against balanceOf. Negative disables it.
  int64 reconcile_every = 2;
  int32 reconcile_batch = 3;
  // rpc_batch_size caps the balanceOf calls in one JSON-RPC batch.
  int32 rpc_batch_size = 4;
  google.protobuf.Duration rpc_timeout = 5;
}

// Registry tunes market-registry, which keeps token and pool metadata in the
// state.postgres database.
message Registry {
  // history_depth is how many recent blocks stay revertible in addition to
  // everything above the finalized height.
  int64 history_depth = 1;
}

// Rankings tunes market-rankings, which rolls market-engine's ClickHouse
// output, holder counts and registry metadata into the token_rankings table
// that market-api lists.
message Rankings {
  google.protobuf.Duration refresh_interval = 1;
  // candle_interval is the token candle size summed for the 24h columns; it
  // must be one of market.intervals.
  google.protobuf.Duration candle_interval = 2;
  // reorg_window is how far behind the last refresh's chain head latest
  // prices are read again, so a reorg that moved them is picked up.
  google.protobuf.Duration reorg_window = 3;
}

// ChLoader tunes ch-loader, which copies raw chain facts into the
// storage.clickhouse database. Blocks older than batch_lag are written in
// batches of up to flush_rows facts or flush_interval; newer blocks are
// written one by one.
message ChLoader {
  google.protobuf.Duration batch_lag = 1;
  int32 flush_rows = 2;
  google.protobuf.Duration flush_interval = 3;
}

// Live configures realtime push. market-engine publishes each block's trades
// and candles, and reorg corrections, to every chain's live_topic, and
// market-api streams them to WebSocket clients at /v1/stream.
message Live {
  bool enabled = 1;
  // max_lag skips blocks further than this behind the clock, so a catch-up
  // does not push history; a negative value such as -1s pushes every block.
  // Reverts always go out.
  google.protobuf.Duration max_lag = 2;
  // candle_throttle is how often market-api sends each changed candle
  // bucket, at its latest value. Trades are sent at once.
  google.protobuf.Duration candle_throttle = 3;
  // client_buffer is how many messages may wait for one client before it is
  // disconnected as too slow.
  int32 client_buffer = 4;
  int32 max_subscriptions = 5;
  // allowed_origins lists other origins browsers may connect from, as host
  // patterns such as "localhost:5173". Same-origin requests and clients that
  // send no Origin are always allowed.
  repeated string allowed_origins = 6;
  // driver is kafka or redis: the transport that carries updates from
  // market-engine to market-api. kafka writes each chain's live_topic on the
  // kafka brokers; redis publishes to a Redis Pub/Sub channel named after
  // live_topic. Either way market-api only sees updates published while it
  // is connected.
  string driver = 7;
  Redis redis = 8;
}

// Redis is the Redis server live.driver redis publishes through.
message Redis {
  string addr = 1;
  string username = 2;
  string password = 3;
  int32 database = 4;
  google.protobuf.Duration dial_timeout = 5;
}

// Metrics configures the Prometheus endpoint every command serves.
message Metrics {
  // addr serves /metrics, such as ":9100"; empty turns it off. Commands
  // sharing one host take -metrics-addr to use their own port.
  string addr = 1;
}

// Chain is one chainstream-evm topic consumed in order by its own engine.
message Chain {
  string name = 1;
  uint64 chain_id = 2;
  string topic = 3;
  // rpc_url is a JSON-RPC endpoint holder-indexer reads balanceOf from. It
  // must serve state by block hash for blocks the indexer is applying, which
  // near the head any full node does.
  string rpc_url = 4;
  // live_topic carries this chain's live updates when live.enabled is set;
  // it defaults to the topic name with a "-live" suffix.
  string live_topic = 5;
  // feeds are the Chainlink USD feeds trusted on this chain.
  repeated Feed feeds = 6;
}

// Feed maps a USD-denominated Chainlink feed to a token it prices. Give either
// proxy or address. A token priced by the same feed as another, such as a
// second USDC, gets its own entry with the same proxy.
message Feed {
  // proxy is the feed's proxy, the stable address Chainlink publishes.
  // market-engine reads it over the chain's rpc_url at startup to trust the
  // aggregator of every phase, since those emit AnswerUpdated.
  string proxy = 1;
  // address is one aggregator, for setups without an rpc_url. It must be
  // updated by hand when Chainlink moves the proxy to a new aggregator.
  string address = 2;
  string token = 3;
  // decimals scale the answer. With proxy it may be left out; when set it
  // must match the proxy's decimals().
  uint32 decimals = 4;
  // description, when set, must match the proxy's description(), such as
  // "ETH / USD", so a mistyped proxy fails at startup.
  string description = 5;
}
